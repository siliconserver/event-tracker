# Betrieb auf der Synology (Container Manager → Projekt) oder per `docker compose up -d`.
# Details: docs/BETRIEB.md
services:
  event-tracker:
    # Von GitHub Actions gebautes, öffentliches Image. Für einen lokalen Build stattdessen `build: .` verwenden.
    image: ${EVENT_TRACKER_IMAGE:-ghcr.io/siliconserver/event-tracker:latest}
    container_name: event-tracker
    restart: unless-stopped
    # UID:GID des NAS-Benutzers, dem /volume1/docker/event-tracker gehört (`id` per SSH)
    user: "${PUID:-1026}:${PGID:-100}"
    ports:
      - "8085:8000"
    environment:
      TZ: Europe/Berlin
      HOME_COUNTRY: Deutschland
      # Im VPN ohne Anmeldung. Über den Synology Reverse Proxy von außen erreichbar?
      # Dann AUTH_ENABLED=true und COOKIE_SECURE=true setzen (siehe docs/BETRIEB.md).
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      REQUIRE_2FA: ${REQUIRE_2FA:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Datenbank, Vorschaubilder, Schlüssel – dieses Verzeichnis sichern (Hyper Backup)
      - /volume1/docker/event-tracker:/data
      # Vorhandener Fotobestand, NUR LESEND
      - /volume1/photo:/photos:ro
    mem_limit: 512m
