{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css">
{% endblock %}
{% block content %}
<h1>Karte</h1>
<form class="filters card" method="get">
  <div><label>Sportart</label><select name="sport_id"><option value="">alle</option>
    {% for s in sports %}<option value="{{ s.id }}" {% if f.sport_id == s.id|string %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
  <div><label>Wettbewerb</label><select name="competition_id"><option value="">alle</option>
    {% for c in competitions %}<option value="{{ c.id }}" {% if f.competition_id == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
  <div><label>Von</label><input type="date" name="date_from" value="{{ f.date_from or '' }}"></div>
  <div><label>Bis</label><input type="date" name="date_to" value="{{ f.date_to or '' }}"></div>
  <div><button>Filtern</button> <a href="/map">zurücksetzen</a></div>
</form>
<div id="map" data-tiles="{{ settings.tile_url }}" data-attribution="{{ settings.tile_attribution }}"></div>
<p id="missing" class="small muted"></p>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/static/map.js"></script>
{% endblock %}
