# Spiegelt main und Versions-Tags (v*) nach GitLab, damit dort die Pipeline das Image baut.
# Ersetzt das Pull-Mirroring von GitLab, das nur in den kostenpflichtigen Stufen enthalten ist.
#
# Einrichtung (einmalig, Details in docs/BETRIEB.md):
#   GitHub → Settings → Secrets and variables → Actions
#     Variable GITLAB_REPO        z. B. gitlab.com/<gruppe>/event-tracker   (ohne https://)
#     Secret   GITLAB_MIRROR_TOKEN Projekt-Access-Token mit write_repository, Rolle Maintainer
# Solange eins von beiden fehlt, beendet sich der Lauf ohne Fehler.
name: Nach GitLab spiegeln

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITLAB_REPO: ${{ vars.GITLAB_REPO }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
    steps:
      - name: Konfiguration prüfen
        id: cfg
        run: |
          if [ -z "$GITLAB_REPO" ] || [ -z "$GITLAB_TOKEN" ]; then
            echo "::notice::GITLAB_REPO oder GITLAB_MIRROR_TOKEN nicht gesetzt – Spiegeln übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Nach GitLab pushen
        if: steps.cfg.outputs.skip != 'true'
        run: |
          git push "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO%.git}.git" "${GITHUB_SHA}:${GITHUB_REF}"
