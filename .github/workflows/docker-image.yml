# Testet den Event-Tracker, baut das Docker-Image (linux/amd64 für Synology DS420+ und
# Rootserver) und veröffentlicht es in der GitHub Container Registry:
#   ghcr.io/siliconserver/event-tracker
#
# Tags:
#   Push auf main      → :latest und :sha-<kurz>
#   Git-Tag v1.2.3     → :1.2.3, :1.2 und :sha-<kurz>
#   Pull Request       → nur bauen und testen, nichts veröffentlichen
#
# Keine Secrets nötig: Der Push läuft mit dem automatischen GITHUB_TOKEN.
# Öffentlich wird das Image durch eine einmalige Einstellung am Paket (docs/BETRIEB.md).
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=event-tracker
            org.opencontainers.image.description=Archiv besuchter Sportevents

      - name: Image bauen (für den Rauchtest lokal laden)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: event-tracker:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rauchtest – startet der Container und antwortet /health?
        run: |
          docker run -d --name smoke -e AUTH_ENABLED=false event-tracker:smoke
          for i in $(seq 1 30); do
            if docker exec smoke python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)" 2>/dev/null; then
              echo "Rauchtest bestanden."; docker rm -f smoke >/dev/null; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          echo "::error::Rauchtest fehlgeschlagen: /health antwortet nicht."
          exit 1

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Veröffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Ein einfaches Manifest ohne Attestierungen; ältere Docker-Versionen
          # (z. B. Synology Container Manager) zeigen sonst einen "unknown/unknown"-Eintrag.
          provenance: false
          sbom: false

      - name: Zusammenfassung
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Veröffentlicht"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
